name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Instalar dependencias
        run: npm install
      - name: Armar carpeta www
        run: mkdir -p www && cp index.html www/ && cp icon-192.png www/ && cp icon-512.png www/
      - name: Agregar plataforma Android
        run: npx cap add android || true
      - name: Aplicar permisos de batería y alarma
        run: python3 fix_manifest.py
      - name: Asegurar carpeta assets
        run: mkdir -p android/app/src/main/assets
      - name: Sincronizar Capacitor
        run: npx cap sync android
      - name: Compilar APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Subir APK descargable
        uses: actions/upload-artifact@v4
        with: { name: agenda-apk, path: android/app/build/outputs/apk/debug/app-debug.apk }
